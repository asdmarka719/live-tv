<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية رفيق TV | الشاملة 💎</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --main: #00f2fe; --bg: #050811; --card: #131927; --vip: #ff0055; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        header { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--main); font-weight: bold; position: sticky; top: 0; z-index: 2000; }
        .video-box { position: sticky; top: 55px; z-index: 1000; background: #000; border-bottom: 1px solid var(--main); }
        video { width: 100%; max-height: 230px; }
        .search-area { padding: 12px; background: #0a111f; }
        #search { width: 90%; padding: 12px; border-radius: 25px; border: 1px solid var(--main); background: #1e293b; color: white; text-align: center; margin: 0 5%; }
        .tabs { display: flex; overflow-x: auto; gap: 8px; padding: 15px; background: var(--bg); scrollbar-width: none; }
        .tabs button { background: var(--card); color: white; border: 1px solid #333; padding: 10px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tabs button.active { background: var(--main); color: #000; font-weight: bold; }
        .tabs button.vip-btn { border-color: var(--vip); color: var(--vip); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #222; cursor: pointer; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--main); transform: scale(1.05); }
        .card i { font-size: 26px; display: block; margin-bottom: 8px; }
        .card span { font-size: 11px; font-weight: bold; display: block; height: 28px; overflow: hidden; }
        .badge { position: absolute; top: 5px; right: 5px; background: var(--vip); color: white; font-size: 8px; padding: 2px 6px; border-radius: 5px; font-weight: bold; }
        #status { text-align: center; padding: 20px; color: var(--main); }
    </style>
</head>
<body>

<header>💎 RAFIQ TV - 970+ CH & VIP 💎</header>

<div class="video-box">
    <video id="player" playsinline controls></video>
</div>

<div class="search-area">
    <input type="text" id="search" placeholder="🔍 ابحث عن أي قناة أو فيلم..." onkeyup="searchFun()">
</div>

<div class="tabs">
    <button class="active" onclick="filter('all', this)">الكل ✨</button>
    <button class="vip-btn" onclick="filter('vip', this)">SHAHID & Netflix 🍿</button>
    <button onclick="filter('sport', this)">الرياضة ⚽</button>
    <button onclick="filter('yemen', this)">اليمن 🇾🇪</button>
    <button onclick="filter('nile', this)">نايل سات 🛰️</button>
</div>

<div id="status">جاري الاتصال بالسيرفرات المباشرة...</div>
<div class="grid" id="main-grid"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const player = new Plyr(video);
    const hls = new Hls();
    const grid = document.getElementById('main-grid');
    const status = document.getElementById('status');

    // رابط المصدر الموحد (يحتوي على نايل سات وشاهد و beIN)
    const m3uSource = 'https://raw.githubusercontent.com/mohamed-attya/IPTV-Free-Arabic/master/Arabic.m3u';

    async function loadData() {
        try {
            const resp = await fetch(m3uSource);
            const data = await resp.text();
            const lines = data.split('\n');
            let channels = [];
            let name = '';

            lines.forEach(line => {
                if (line.startsWith('#EXTINF:')) {
                    name = line.split(',')[1] || 'قناة';
                } else if (line.startsWith('http')) {
                    const url = line.trim();
                    let low = name.toLowerCase();
                    let cat = 'nile';

                    if (low.includes('shahid') || low.includes('netflix') || low.includes('vip') || low.includes('movie')) cat = 'vip';
                    else if (low.includes('bein') || low.includes('sport') || low.includes('ssc')) cat = 'sport';
                    else if (low.includes('yemen') || low.includes('shabab')) cat = 'yemen';

                    channels.push({ name, url, cat });
                }
            });

            render(channels);
            status.style.display = 'none';
        } catch (e) {
            status.innerText = '⚠️ السيرفر مشغول، يرجى المحاولة لاحقاً';
        }
    }

    function render(list) {
        grid.innerHTML = '';
        list.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.cat = ch.cat;
            card.onclick = () => play(ch.url);
            
            let icon = '🛰️';
            if(ch.cat === 'vip') icon = '🍿';
            else if(ch.cat === 'sport') icon = '⚽';
            else if(ch.cat === 'yemen') icon = '🇾🇪';

            card.innerHTML = `
                ${ch.cat === 'vip' ? '<div class="badge">VIP</div>' : ''}
                <i>${icon}</i>
                <span>${ch.name}</span>
            `;
            grid.appendChild(card);
        });
    }

    function play(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
        window.scrollTo({ top: 55, behavior: 'smooth' });
    }

    function filter(cat, btn) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function searchFun() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none';
        });
    }

    loadData();
</script>
</body>
</html>
