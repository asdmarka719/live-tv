<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ TV PRO 💎</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --bg: #0b0e14; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        header { background: linear-gradient(90deg, #161b28, var(--primary)); padding: 15px; text-align: center; }
        .player-box { position: sticky; top: 0; z-index: 100; background: #000; padding: 10px; border-bottom: 2px solid var(--primary); }
        .video-js { width: 100% !important; height: 220px !important; border-radius: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; }
        .channel-card { background: #1a1f2b; border-radius: 15px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #252a3a; }
        .channel-card:hover { border-color: var(--primary); transform: scale(1.03); transition: 0.3s; }
        .fixed-tag { background: #ff9800; color: black; font-size: 8px; padding: 2px 5px; border-radius: 4px; position: absolute; top: 5px; right: 5px; }
    </style>
</head>
<body>

<header><h1>RAFIQ TV | القنوات المباشرة 🇾🇪</h1></header>

<div class="player-box">
    <video id="main-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="grid">
    <div class="channel-card" onclick="playChan('https://yemenshabab.com/live/index.m3u8')">
        <div class="fixed-tag">ثابت</div><span>يمن شباب</span>
    </div>
    <div class="channel-card" onclick="playChan('https://almahriah.net/live/master.m3u8')">
        <div class="fixed-tag">ثابت</div><span>المهرية</span>
    </div>
    <div class="channel-card" onclick="playChan('https://almasirah.net.ye/live/index.m3u8')">
        <div class="fixed-tag">ثابت</div><span>المسيرة</span>
    </div>
    <div class="channel-card" onclick="playChan('https://www.youtube.com/embed/live_stream?channel=UCp2pfdOa-R7A8W9KjS3p5qg')">
        <div class="fixed-tag">ثابت</div><span>الهوية</span>
    </div>

    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('main-player', { fluid: true });
    function playChan(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
