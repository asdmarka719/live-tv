<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية رفيق TV 💎</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2fe; --bg: #050811; --card: #131927; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Cairo', sans-serif; }
        header { background: linear-gradient(135deg, #0f172a, #1e293b); padding: 20px; text-align: center; border-bottom: 3px solid var(--main); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .player-area { position: sticky; top: 0; z-index: 999; background: #000; padding: 10px; border-bottom: 1px solid var(--main); }
        .video-js { width: 100% !important; height: 220px !important; border-radius: 15px; }
        .nav-tabs { display: flex; overflow-x: auto; gap: 10px; padding: 15px; scrollbar-width: none; background: #0a0f1d; }
        .nav-tabs button { background: var(--card); color: #fff; border: 1px solid #2d3748; padding: 10px 20px; border-radius: 30px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .nav-tabs button.active { background: var(--main); color: #000; font-weight: bold; border-color: var(--main); box-shadow: 0 0 15px var(--main); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; padding: 20px; }
        .chan-card { background: var(--card); border-radius: 18px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid #1e293b; transition: 0.4s; position: relative; overflow: hidden; }
        .chan-card:hover { transform: translateY(-8px); border-color: var(--main); box-shadow: 0 10px 20px rgba(0,242,254,0.2); }
        .chan-card i { font-size: 28px; display: block; margin-bottom: 10px; }
        .chan-card span { font-size: 12px; font-weight: bold; line-height: 1.4; display: block; height: 35px; }
        .live-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #ff0055; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @media (min-width: 768px) { .video-js { height: 450px !important; } }
    </style>
</head>
<body>

<header>✨ إمبراطورية رفيق TV ✨</header>

<div class="player-area">
    <video id="main-player" class="video-js vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="nav-tabs">
    <button class="active" onclick="showCat('all', this)">الكل</button>
    <button onclick="showCat('islam', this)">🌙 إسلامي</button>
    <button onclick="showCat('yemen', this)">🇾🇪 اليمن</button>
    <button onclick="showCat('sport', this)">⚽ رياضة</button>
    <button onclick="showCat('doc', this)">🐾 وثائقي</button>
    <button onclick="showCat('movie', this)">🎬 أفلام/مسرح</button>
    <button onclick="showCat('fight', this)">🥊 مصارعة</button>
</div>

<div class="grid" id="channels-container">
    <div class="chan-card" data-cat="islam" onclick="play('https://win.holol.com/live/quran/playlist.m3u8')"><div class="live-dot"></div><i>🕋</i><span>القرآن الكريم</span></div>
    <div class="chan-card" data-cat="islam" onclick="play('https://win.holol.com/live/sunnah/playlist.m3u8')"><div class="live-dot"></div><i>🕌</i><span>السنة النبوية</span></div>
    <div class="chan-card" data-cat="yemen" onclick="play('https://yemenshabab.com/live/index.m3u8')"><div class="live-dot"></div><i>🇾🇪</i><span>يمن شباب</span></div>
    <div class="chan-card" data-cat="yemen" onclick="play('https://almahriah.net/live/master.m3u8')"><div class="live-dot"></div><i>🇾🇪</i><span>المهرية</span></div>
    <div class="chan-card" data-cat="yemen" onclick="play('https://almasirah.net.ye/live/index.m3u8')"><div class="live-dot"></div><i>🇾🇪</i><span>المسيرة</span></div>
    <div class="chan-card" data-cat="yemen" onclick="play('https://shabwah-tv.net/live/index.m3u8')"><i>🇾🇪</i><span>قناة شبوة</span></div>
    
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('main-player', { fluid: true });
    function play(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 80, behavior: 'smooth' });
    }
    function showCat(cat, btn) {
        document.querySelectorAll('.chan-card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
</body>
</html>
