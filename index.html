<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية رفيق TV | RAFIQ TV PRO</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --main: #00d2ff; --bg: #0f172a; --card: #1e293b; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; }
        header { background: linear-gradient(135deg, #1e293b, var(--main)); padding: 20px; text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .player-box { position: sticky; top: 0; z-index: 1000; background: #000; padding: 10px; border-bottom: 2px solid var(--main); }
        .tabs { display: flex; overflow-x: auto; gap: 10px; padding: 15px; background: #0a0f1d; }
        .tabs button { background: var(--card); color: #fff; border: 1px solid #334155; padding: 10px 20px; border-radius: 25px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tabs button.active { background: var(--main); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--main); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #334155; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 5px 15px rgba(0,210,255,0.3); }
        .card i { font-size: 25px; display: block; margin-bottom: 10px; }
        .card span { font-size: 12px; font-weight: bold; }
        #search { width: 90%; margin: 10px 5%; padding: 12px; border-radius: 20px; border: none; background: #334155; color: white; text-align: center; }
    </style>
</head>
<body>

<header>🚀 إمبراطورية رفيق TV 🚀</header>

<div class="player-box">
    <video id="player" playsinline controls data-poster="https://bit.ly/3yLhZfL"></video>
</div>

<input type="text" id="search" placeholder="🔍 ابحث عن القناة هنا..." onkeyup="searchChan()">

<div class="tabs">
    <button class="active" onclick="filterCat('all', this)">الكل</button>
    <button onclick="filterCat('islam', this)">🌙 إسلامي</button>
    <button onclick="filterCat('yemen', this)">🇾🇪 اليمن</button>
    <button onclick="filterCat('sport', this)">⚽ رياضة/مصارعة</button>
    <button onclick="filterCat('doc', this)">🐾 وثائقي</button>
    <button onclick="filterCat('movie', this)">🎬 أفلام/مسرح</button>
</div>

<div class="grid" id="main-grid">
    <div class="card" data-cat="islam" onclick="playHLS('https://win.holol.com/live/quran/playlist.m3u8')"><i>🌙</i><span>القرآن الكريم</span></div>
    <div class="card" data-cat="islam" onclick="playHLS('https://win.holol.com/live/sunnah/playlist.m3u8')"><i>🕋</i><span>السنة النبوية</span></div>
    <div class="card" data-cat="yemen" onclick="playHLS('https://yemenshabab.com/live/index.m3u8')"><i>🇾🇪</i><span>يمن شباب</span></div>
    <div class="card" data-cat="yemen" onclick="playHLS('https://almahriah.net/live/master.m3u8')"><i>🇾🇪</i><span>المهرية</span></div>
    <div class="card" data-cat="sport" onclick="playHLS('https://fancode.com/video/index.m3u8')"><i>🥊</i><span>مصارعة Slap</span></div>
    
    </div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const player = new Plyr(video);
    const hls = new Hls();

    function playHLS(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        }
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function searchChan() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
