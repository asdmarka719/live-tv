<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ TV | المنصة الشاملة 💎</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --main: #00f2fe; --bg: #050811; --card: #131927; --accent: #ff0055; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow-x: hidden; }
        header { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--main); font-weight: bold; position: sticky; top: 0; z-index: 2000; }
        .player-fixed { position: sticky; top: 55px; z-index: 1000; background: #000; border-bottom: 1px solid var(--main); }
        video { width: 100%; max-height: 250px; }
        .search-area { padding: 10px; background: #0a0f1d; }
        #searchBar { width: 94%; padding: 12px; border-radius: 25px; border: none; background: #1e293b; color: white; text-align: center; font-size: 16px; margin: 0 3%; box-shadow: 0 0 10px rgba(0,242,254,0.2); }
        .tabs { display: flex; overflow-x: auto; gap: 8px; padding: 15px; background: #050811; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { background: var(--card); color: white; border: 1px solid #333; padding: 10px 22px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; font-size: 14px; }
        .tabs button.active { background: var(--main); color: #000; font-weight: bold; transform: scale(1.05); }
        .tabs button.vip { border-color: var(--accent); color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #222; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--main); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,242,254,0.3); }
        .card i { font-size: 26px; display: block; margin-bottom: 8px; }
        .card span { font-size: 11px; font-weight: bold; display: block; height: 30px; overflow: hidden; line-height: 1.3; }
        .badge { position: absolute; top: 5px; left: 5px; background: var(--accent); color: white; font-size: 8px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        #loader { text-align: center; padding: 40px; color: var(--main); font-size: 18px; }
    </style>
</head>
<body>

<header>🚀 إمبراطورية رفيق TV | Cinema & Live 🚀</header>

<div class="player-fixed">
    <video id="player" playsinline controls></video>
</div>

<div class="search-area">
    <input type="text" id="searchBar" placeholder="🔍 ابحث عن: شاهد، نتفلكس، أفلام، أو قناة..." onkeyup="search()">
</div>

<div class="tabs">
    <button class="active" onclick="filter('all', this)">الكل ✨</button>
    <button class="vip" onclick="filter('vip', this)">SHAHID & Netflix 🍿</button>
    <button onclick="filter('movie', this)">أفلام ومسلسلات 🎬</button>
    <button onclick="filter('sport', this)">beIN الرياضية ⚽</button>
    <button onclick="filter('yemen', this)">اليمن 🇾🇪</button>
    <button onclick="filter('nile', this)">نايل سات 🛰️</button>
</div>

<div id="loader">جاري تحميل باقة الأفلام والمسلسلات...</div>
<div class="grid" id="main-grid"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const player = new Plyr(video);
    const hls = new Hls();
    const grid = document.getElementById('main-grid');
    const loader = document.getElementById('loader');

    // مصادر القنوات والأفلام (تلقائية التحديث)
    const sources = [
        'https://raw.githubusercontent.com/mohamed-attya/IPTV-Free-Arabic/master/Arabic.m3u',
        'https://iptv-org.github.io/iptv/index.m3u'
    ];

    async function init() {
        try {
            let allChannels = [];
            for (let src of sources) {
                const resp = await fetch(src);
                const text = await resp.text();
                allChannels = allChannels.concat(parseM3U(text));
            }
            render(allChannels);
            loader.style.display = 'none';
        } catch (e) {
            loader.innerText = '⚠️ السيرفر مشغول، يرجى تحديث الصفحة';
        }
    }

    function parseM3U(data) {
        const lines = data.split('\n');
        let result = [];
        let name = '';
        for (let line of lines) {
            if (line.startsWith('#EXTINF:')) {
                name = line.split(',')[1] || 'قناة';
            } else if (line.startsWith('http')) {
                let url = line.trim();
                let low = name.toLowerCase();
                let cat = 'nile';

                if (low.includes('shahid') || low.includes('netflix') || low.includes('vip')) cat = 'vip';
                else if (low.includes('movie') || low.includes('cinema') || low.includes('drama') || low.includes('مسلسل')) cat = 'movie';
                else if (low.includes('bein') || low.includes('sport') || low.includes('alkass')) cat = 'sport';
                else if (low.includes('yemen') || low.includes('shabab')) cat = 'yemen';
                
                result.push({ name, url, cat });
            }
        }
        return result;
    }

    function render(list) {
        grid.innerHTML = list.map(ch => `
            <div class="card" data-cat="${ch.cat}" onclick="play('${ch.url}')">
                ${ch.cat === 'vip' ? '<div class="badge">VIP</div>' : ''}
                <i>${getIcon(ch.cat)}</i>
                <span>${ch.name}</span>
            </div>
        `).join('');
    }

    function getIcon(cat) {
        if (cat === 'vip') return '💎';
        if (cat === 'movie') return '🎬';
        if (cat === 'sport') return '⚽';
        if (cat === 'yemen') return '🇾🇪';
        return '🛰️';
    }

    function play(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else {
            video.src = url;
        }
        player.play();
        window.scrollTo({ top: 55, behavior: 'smooth' });
    }

    function filter(cat, btn) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function search() {
        let val = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none';
        });
    }

    init();
</script>
</body>
</html>
