<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفيق تي في | البث المباشر</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #0a0f1b; color: white; font-family: sans-serif; padding-bottom: 80px; }
        header { padding: 15px; background: #1c2230; text-align: center; border-bottom: 2px solid #e91e63; }
        .player-section { background: #1c2230; margin: 10px; padding: 10px; border-radius: 15px; position: sticky; top: 10px; z-index: 100; }
        .video-js { width: 100% !important; height: 220px !important; border-radius: 10px; }
        .categories { padding: 10px; display: flex; overflow-x: auto; gap: 10px; }
        .categories button { background: #1c2230; color: white; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .channels { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .channel { background: #1c2230; padding: 10px; border-radius: 12px; cursor: pointer; text-align: center; border: 1px solid #222; }
        .channel img { width: 45px; height: 45px; border-radius: 50%; margin-bottom: 8px; }
        .channel span { display: block; font-size: 11px; font-weight: bold; height: 32px; overflow: hidden; }
    </style>
</head>
<body>

<header><h1>RAFIQ TV</h1></header>

<section class="player-section">
    <video id="main-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto"></video>
</section>

<div class="categories">
    <button onclick="filterChannels('all')">الكل</button>
    <button onclick="filterChannels('sport')">beIN Sports</button>
    <button onclick="filterChannels('yemen')">قنوات اليمن</button>
</div>

<div class="channels" id="channel-list">
    <div class="channel" data-category="yemen" onclick="playChan('https://yemenshabab.com/live/index.m3u8')">
        <img src="https://yemenshabab.net/img/logo.png"><span>يمن شباب</span>
    </div>
    <div class="channel" data-category="yemen" onclick="playChan('https://almahriah.net/live/master.m3u8')">
        <img src="https://almahriah.net/img/logo.png"><span>المهرية</span>
    </div>
    <div class="channel" data-category="yemen" onclick="playChan('https://almasirah.net.ye/live/index.m3u8')">
        <img src="https://almasirah.net.ye/img/logo.png"><span>المسيرة</span>
    </div>

    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>
<script>
    var player = videojs('main-player', { fluid: true });
    function playChan(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function filterChannels(cat) {
        document.querySelectorAll('.channel').forEach(ch => {
            ch.style.display = (cat === 'all' || ch.getAttribute('data-category') === cat) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
