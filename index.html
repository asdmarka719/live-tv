<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية رفيق TV | النسخة المعتمدة 💎</title>
    <style>
        :root { --main: #00f2fe; --bg: #050811; --card: #131927; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        header { padding: 15px; text-align: center; background: #111; border-bottom: 3px solid var(--main); font-weight: bold; font-size: 20px; }
        .video-container { position: sticky; top: 0; z-index: 1000; background: #000; width: 100%; aspect-ratio: 16/9; border-bottom: 2px solid var(--main); }
        iframe, video { width: 100%; height: 100%; border: none; }
        .nav-bar { display: flex; overflow-x: auto; gap: 10px; padding: 12px; background: #0a0f1d; }
        .nav-bar button { background: var(--card); color: white; border: 1px solid #333; padding: 10px 18px; border-radius: 25px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .nav-bar button.active { background: var(--main); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--main); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #222; cursor: pointer; }
        .card:hover { border-color: var(--main); transform: scale(1.05); }
        .card i { font-size: 28px; display: block; margin-bottom: 8px; }
        .card span { font-size: 12px; font-weight: bold; display: block; }
    </style>
</head>
<body>

<header>🚀 RAFIQ TV PRO - البث المضمون 🚀</header>

<div class="video-container" id="player-box">
    <iframe id="main-iframe" src="https://www.youtube.com/embed/Mue60_w8_0w?autoplay=1" allowfullscreen allow="autoplay"></iframe>
</div>

<div class="nav-bar">
    <button class="active" onclick="filter('all')">الكل ✨</button>
    <button onclick="filter('islam')">إسلامي 🌙</button>
    <button onclick="filter('yemen')">اليمن 🇾🇪</button>
    <button onclick="filter('sport')">رياضة ⚽</button>
    <button onclick="filter('news')">أخبار 🌍</button>
</div>

<div class="grid" id="main-grid">
    <div class="card" data-cat="islam" onclick="change('https://www.youtube.com/embed/Mue60_w8_0w')"><i>🌙</i><span>القرآن الكريم</span></div>
    <div class="card" data-cat="islam" onclick="change('https://www.youtube.com/embed/mH_3v_Lp-6M')"><i>🕌</i><span>السنة النبوية</span></div>
    
    <div class="card" data-cat="yemen" onclick="change('https://www.youtube.com/embed/nU_yWshY3oQ')"><i>🇾🇪</i><span>قناة المهرية</span></div>
    <div class="card" data-cat="yemen" onclick="change('https://www.youtube.com/embed/v79_pT0eF-o')"><i>🇾🇪</i><span>قناة السعيدة</span></div>
    <div class="card" data-cat="yemen" onclick="change('https://www.youtube.com/embed/vYm6E6A2178')"><i>🇾🇪</i><span>اليمن الرسمية</span></div>

    <div class="card" data-cat="news" onclick="change('https://www.youtube.com/embed/bNyUyrR0PHo')"><i>🌍</i><span>الجزيرة</span></div>
    <div class="card" data-cat="news" onclick="change('https://www.youtube.com/embed/w_dwZ_LQRH0')"><i>🌍</i><span>العربية</span></div>
    <div class="card" data-cat="news" onclick="change('https://www.youtube.com/embed/s9idWvO-N9o')"><i>🌍</i><span>سكاي نيوز</span></div>

    <div class="card" data-cat="sport" onclick="change('https://www.youtube.com/embed/Xm_2zS0-j8Y')"><i>⚽</i><span>beIN الإخبارية</span></div>
</div>

<script>
    function change(url) {
        document.getElementById('player-box').innerHTML = `<iframe src="${url}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filter(cat) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.nav-bar button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>
</body>
</html>
