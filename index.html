<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ TV ULTIMATE | الإمبراطورية</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --accent: #00f2fe; --bg: #050811; --card: #131927; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        header { background: #111; padding: 15px; text-align: center; border-bottom: 3px solid var(--accent); font-weight: bold; font-size: 22px; }
        .player-container { position: sticky; top: 0; z-index: 1000; background: #000; padding: 5px; }
        video { width: 100%; max-height: 250px; border-radius: 10px; }
        .tabs { display: flex; overflow-x: auto; gap: 10px; padding: 10px; background: #0a0f1d; }
        .tabs button { background: var(--card); color: white; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tabs button.active { background: var(--accent); color: #000; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: scale(1.05); }
        .card i { font-size: 24px; display: block; margin-bottom: 5px; }
        .card span { font-size: 11px; font-weight: bold; display: block; height: 30px; overflow: hidden; }
        #loading { text-align: center; padding: 20px; color: var(--accent); }
    </style>
</head>
<body>

<header>💎 إمبراطورية رفيق TV (نايل سات + beIN) 💎</header>

<div class="player-container">
    <video id="player" playsinline controls></video>
</div>

<div class="tabs">
    <button class="active" onclick="filter('all')">الكل ✨</button>
    <button onclick="filter('sport')">beIN & رياضة ⚽</button>
    <button onclick="filter('islam')">إسلامي 🌙</button>
    <button onclick="filter('yemen')">اليمن 🇾🇪</button>
    <button onclick="filter('doc')">وثائقي 🐾</button>
</div>

<div id="loading">جاري جلب قنوات نايل سات و beIN...</div>
<div class="grid" id="main-grid">
    </div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    const video = document.getElementById('player');
    const player = new Plyr(video);
    const hls = new Hls();
    const grid = document.getElementById('main-grid');
    const loading = document.getElementById('loading');

    // مصادر قنوات نايل سات و beIN المحدثة
    const playlistUrl = 'https://raw.githubusercontent.com/mohamed-attya/IPTV-Free-Arabic/master/Arabic.m3u';

    async function loadChannels() {
        try {
            const response = await fetch(playlistUrl);
            const data = await response.text();
            const lines = data.split('\n');
            let channels = [];
            let currentName = '';

            lines.forEach(line => {
                if (line.startsWith('#EXTINF:')) {
                    currentName = line.split(',')[1] || 'قناة غير معروفة';
                } else if (line.startsWith('http')) {
                    let url = line.strip ? line.strip() : line.trim();
                    let low = currentName.toLowerCase();
                    let cat = 'other';
                    
                    if (low.includes('bein') || low.includes('sport') || low.includes('alkass')) cat = 'sport';
                    else if (low.includes('quran') || low.includes('islam') || low.includes('قرآن')) cat = 'islam';
                    else if (low.includes('yemen') || low.includes('shabab')) cat = 'yemen';
                    else if (low.includes('national') || low.includes('nat geo')) cat = 'doc';

                    channels.push({ name: currentName, url: url, cat: cat });
                }
            });

            renderChannels(channels);
            loading.style.display = 'none';
        } catch (error) {
            loading.innerText = 'فشل جلب القنوات، يرجى المحاولة لاحقاً';
        }
    }

    function renderChannels(list) {
        grid.innerHTML = '';
        list.forEach(ch => {
            const icon = ch.cat === 'sport' ? '⚽' : ch.cat === 'islam' ? '🌙' : ch.cat === 'yemen' ? '🇾🇪' : '📺';
            const html = `
                <div class="card" data-cat="${ch.cat}" onclick="playChan('${ch.url}')">
                    <i>${icon}</i>
                    <span>${ch.name}</span>
                </div>`;
            grid.insertAdjacentHTML('beforeend', html);
        });
    }

    function playChan(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        }
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filter(cat) {
        document.querySelectorAll('.card').forEach(card => {
            card.style.display = (cat === 'all' || card.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    loadChannels();
</script>
</body>
</html>
