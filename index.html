<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ TV | البث المباشر المضمون</title>
    <style>
        :root { --main: #00f2fe; --bg: #0b0f19; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; text-align: center; }
        header { padding: 20px; background: #111; border-bottom: 3px solid var(--main); font-size: 22px; font-weight: bold; }
        .player-wrap { position: sticky; top: 0; z-index: 100; background: #000; padding-bottom: 56.25%; height: 0; overflow: hidden; border-bottom: 2px solid var(--main); }
        .player-wrap iframe, .player-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .tabs { display: flex; overflow-x: auto; gap: 10px; padding: 15px; background: #070a13; }
        .tabs button { background: #1c2536; color: white; border: 1px solid #333; padding: 10px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tabs button.active { background: var(--main); color: #000; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #1c2536; border-radius: 15px; padding: 15px; cursor: pointer; border: 1px solid #2d3748; transition: 0.3s; }
        .card:hover { border-color: var(--main); transform: scale(1.05); }
        .card i { font-size: 30px; display: block; margin-bottom: 10px; }
        .card span { font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<header>💎 إمبراطورية رفيق TV | البث المعتمد 💎</header>

<div class="player-wrap" id="video-container">
    <iframe id="main-frame" src="https://www.youtube.com/embed/Mue60_w8_0w?autoplay=1" allowfullscreen></iframe>
</div>

<div class="tabs">
    <button class="active" onclick="filter('all')">الكل</button>
    <button onclick="filter('islam')">إسلامي 🌙</button>
    <button onclick="filter('yemen')">اليمن 🇾🇪</button>
    <button onclick="filter('news')">أخبار 🌍</button>
</div>

<div class="grid">
    <div class="card" data-cat="islam" onclick="changeSrc('https://www.youtube.com/embed/Mue60_w8_0w')"><i>🌙</i><span>القرآن الكريم</span></div>
    <div class="card" data-cat="islam" onclick="changeSrc('https://www.youtube.com/embed/mH_3v_Lp-6M')"><i>🕌</i><span>السنة النبوية</span></div>

    <div class="card" data-cat="yemen" onclick="changeSrc('https://yemenshabab.com/live/index.m3u8', 'video')"><i>🇾🇪</i><span>يمن شباب (HLS)</span></div>
    <div class="card" data-cat="yemen" onclick="changeSrc('https://www.youtube.com/embed/nU_yWshY3oQ')"><i>🇾🇪</i><span>المهرية</span></div>
    <div class="card" data-cat="yemen" onclick="changeSrc('https://www.youtube.com/embed/v79_pT0eF-o')"><i>🇾🇪</i><span>قناة السعيدة</span></div>

    <div class="card" data-cat="news" onclick="changeSrc('https://www.youtube.com/embed/bNyUyrR0PHo')"><i>🌍</i><span>الجزيرة</span></div>
    <div class="card" data-cat="news" onclick="changeSrc('https://www.youtube.com/embed/w_dwZ_LQRH0')"><i>🌍</i><span>العربية</span></div>
    <div class="card" data-cat="news" onclick="changeSrc('https://www.youtube.com/embed/s9idWvO-N9o')"><i>🌍</i><span>سكاي نيوز</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    function changeSrc(url, type = 'iframe') {
        const container = document.getElementById('video-container');
        if (type === 'iframe') {
            container.innerHTML = `<iframe src="${url}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
        } else {
            container.innerHTML = `<video id="hls-player" controls autoplay style="width:100%; height:100%;"></video>`;
            const video = document.getElementById('hls-player');
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            }
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filter(cat) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
