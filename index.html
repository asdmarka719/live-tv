<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفيق تي في | المشغل الاحترافي</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #0a0f1b; color: white; font-family: sans-serif; }
        header { padding: 15px; background: #1c2230; text-align: center; border-bottom: 2px solid #e91e63; }
        .player-container { max-width: 900px; margin: 10px auto; padding: 10px; background: #1c2230; border-radius: 15px; }
        .video-js { width: 100% !important; height: 250px !important; border-radius: 10px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 20px; }
        .chan-card { background: #1c2230; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #333; transition: 0.3s; }
        .chan-card:hover { border-color: #e91e63; transform: translateY(-3px); }
        .chan-card span { font-size: 12px; font-weight: bold; color: #eee; }
    </style>
</head>
<body>

<header><h1>RAFIQ TV 📺</h1></header>

<div class="player-container">
    <video id="main-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="channels-grid">
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('main-player', { fluid: true });
    function playChan(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
