<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ LIVE TV | رفيق تي في</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --bg: #0f0f0f; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Cairo', sans-serif; }
        header { background: linear-gradient(to right, var(--primary), var(--secondary)); padding: 15px; text-align: center; font-weight: bold; font-size: 1.4rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .player-container { position: sticky; top: 0; z-index: 1000; background: #000; padding: 5px; border-bottom: 2px solid var(--primary); }
        .video-js { width: 100% !important; height: 230px !important; border-radius: 8px; }
        .categories { display: flex; overflow-x: auto; gap: 10px; padding: 15px; scrollbar-width: none; }
        .categories button { background: #222; color: #fff; border: 1px solid #444; padding: 8px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .categories button.active { background: var(--primary); border-color: var(--primary); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 15px; }
        .channel-item { background: #1a1a1a; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid #333; transition: 0.3s; position: relative; }
        .channel-item:hover { transform: scale(1.05); border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .channel-item span { font-size: 12px; font-weight: 600; display: block; height: 32px; overflow: hidden; margin-top: 5px; }
        .live-label { position: absolute; top: 5px; right: 5px; background: red; color: white; font-size: 8px; padding: 2px 5px; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @media (min-width: 768px) { .video-js { height: 450px !important; } }
    </style>
</head>
<body>

<header>RAFIQ PREMIUM TV 💎</header>

<div class="player-container">
    <video id="main-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="categories" id="cat-bar">
    <button class="active" onclick="filterData('all')">الكل ✨</button>
    <button onclick="filterData('sport')">beIN & رياضة ⚽</button>
    <button onclick="filterData('yemen')">اليمن 🇾🇪</button>
    <button onclick="filterData('news')">أخبار 🌍</button>
</div>

<div class="grid" id="channels-list">
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('main-player', { fluid: true });
    function playChan(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function filterData(cat) {
        document.querySelectorAll('.channel-item').forEach(item => {
            item.style.display = (cat === 'all' || item.dataset.category === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.categories button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>
</body>
</html>
