<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية رفيق TV | النسخة الذهبية 💎</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --main: #00f2fe; --bg: #050811; --card: #131927; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        header { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--main); font-weight: bold; }
        .player-wrap { position: sticky; top: 0; z-index: 1000; background: #000; border-bottom: 1px solid var(--main); }
        video { width: 100%; height: 230px; }
        .tabs { display: flex; overflow-x: auto; gap: 10px; padding: 10px; background: #0a0f1d; }
        .tabs button { background: var(--card); color: white; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tabs button.active { background: var(--main); color: #000; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 15px; }
        .card { background: var(--card); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: var(--main); transform: translateY(-3px); }
        .card i { font-size: 20px; display: block; margin-bottom: 5px; }
        .card span { font-size: 10px; font-weight: bold; display: block; height: 25px; overflow: hidden; }
        #status { font-size: 12px; color: var(--main); text-align: center; padding: 10px; }
    </style>
</head>
<body>

<header>💎 RAFIQ TV ULTIMATE 💎</header>

<div class="player-wrap">
    <video id="player" playsinline controls></video>
</div>

<div id="status">جاري الاتصال بالسيرفر العالمي...</div>

<div class="tabs">
    <button class="active" onclick="filter('all')">الكل</button>
    <button onclick="filter('sport')">beIN & رياضة ⚽</button>
    <button onclick="filter('islam')">إسلامي 🌙</button>
    <button onclick="filter('yemen')">اليمن 🇾🇪</button>
    <button onclick="filter('doc')">وثائقي 🐾</button>
</div>

<div class="grid" id="main-grid">
    <div class="card" data-cat="islam" onclick="play('https://win.holol.com/live/quran/playlist.m3u8')"><i>🌙</i><span>القرآن الكريم</span></div>
    <div class="card" data-cat="yemen" onclick="play('https://yemenshabab.com/live/index.m3u8')"><i>🇾🇪</i><span>يمن شباب</span></div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const player = new Plyr(video);
    const hls = new Hls();
    const status = document.getElementById('status');
    const grid = document.getElementById('main-grid');

    // رابط سيرفر عالمي متجدد تلقائياً لقنوات نايل سات و beIN
    const m3uSource = 'https://raw.githubusercontent.com/mohamed-attya/IPTV-Free-Arabic/master/Arabic.m3u';

    async function init() {
        try {
            const resp = await fetch(m3uSource);
            const text = await resp.text();
            const lines = text.split('\n');
            let name = '';
            
            lines.forEach(line => {
                if(line.startsWith('#EXTINF:')) {
                    name = line.split(',')[1] || 'قناة';
                } else if(line.startsWith('http')) {
                    const url = line.trim();
                    let cat = 'other';
                    if(name.toLowerCase().includes('bein') || name.toLowerCase().includes('sport')) cat = 'sport';
                    else if(name.toLowerCase().includes('yemen')) cat = 'yemen';
                    else if(name.includes('قرآن') || name.includes('اسلام')) cat = 'islam';
                    else if(name.toLowerCase().includes('national')) cat = 'doc';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.cat = cat;
                    card.onclick = () => play(url);
                    card.innerHTML = `<i>📺</i><span>${name}</span>`;
                    grid.appendChild(card);
                }
            });
            status.innerText = '✅ تم تحديث ٥٠٠+ قناة بنجاح';
        } catch (e) {
            status.innerText = '⚠️ السيرفر الخارجي بطيء، جاري استخدام الاحتياطي';
        }
    }

    function play(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else {
            video.src = url;
        }
        player.play();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function filter(cat) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
    }

    init();
</script>
</body>
</html>
