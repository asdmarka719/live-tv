<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفيق تي في | البث المباشر المطور</title>
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
    <link href="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.css" rel="stylesheet">

    <style>
        :root { --accent: #e91e63; --bg: #050505; --card-bg: #121212; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding-bottom: 50px; }
        header { background: linear-gradient(to bottom, #1a1a1a, var(--bg)); padding: 20px; text-align: center; border-bottom: 2px solid var(--accent); }
        header h1 { margin: 0; font-size: 1.8rem; color: var(--accent); text-shadow: 0 0 10px rgba(233, 30, 99, 0.5); }
        .player-wrapper { max-width: 1000px; margin: 20px auto; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.9); border: 1px solid #222; }
        .video-js { width: 100% !important; height: 500px !important; }
        .content { max-width: 1100px; margin: auto; padding: 0 15px; }
        .section-title { font-size: 1.4rem; margin: 30px 0 15px; padding-right: 15px; border-right: 4px solid var(--accent); color: #eee; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.3s; }
        .card:hover { background: #1a1a1a; border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(233, 30, 99, 0.2); }
        .card span { font-size: 0.85rem; font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 768px) { .video-js { height: 250px !important; } }
    </style>
</head>
<body>

<header>
    <h1>RAFIQ LIVE TV 📺</h1>
</header>

<div class="content">
    <div class="player-wrapper">
        <video id="main-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto">
            <source src="" type="application/x-mpegURL">
        </video>
    </div>

    <h2 class="section-title">beIN Sports & Sports</h2>
    <div class="grid">
        </div>

    <h2 class="section-title">قنوات نايل سات (اليمن ومصر)</h2>
    <div class="grid">
        </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://unpkg.com/videojs-contrib-quality-levels@2.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
<script src="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>

<script>
    var player = videojs('main-player', { fluid: true, html5: { vhs: { overrideNative: true } } });
    player.httpSourceSelector();
    function playChan(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
