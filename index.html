<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ ULTIMATE TV 💎</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root { --accent: #00f2fe; --bg: #050505; --card: #121212; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow-x: hidden; }
        header { background: #111; padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 2000; }
        .search-box { padding: 10px; background: #111; display: flex; justify-content: center; }
        #search-input { width: 90%; padding: 10px; border-radius: 20px; border: 1px solid #333; background: #222; color: white; text-align: center; }
        .player-container { position: sticky; top: 60px; z-index: 1000; background: #000; padding: 10px; }
        .video-js { width: 100% !important; height: 210px !important; border-radius: 15px; box-shadow: 0 0 15px var(--accent); }
        .tabs { display: flex; overflow-x: auto; gap: 8px; padding: 10px; scrollbar-width: none; background: #0a0a0a; }
        .tabs button { background: #1a1a1a; color: #ccc; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; white-space: nowrap; cursor: pointer; }
        .tabs button.active { background: var(--accent); color: black; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #222; cursor: pointer; transition: 0.2s; position: relative; }
        .card:hover { border-color: var(--accent); transform: scale(1.05); }
        .card span { display: block; font-size: 11px; margin-top: 8px; font-weight: bold; height: 28px; overflow: hidden; }
        .card i { font-style: normal; font-size: 20px; }
    </style>
</head>
<body>

<header>RAFIQ TV PRO 🚀</header>

<div class="player-container">
    <video id="vid" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="search-box">
    <input type="text" id="search-input" placeholder="🔍 ابحث عن قناة (قرآن، يمن، كورة...)" onkeyup="search()">
</div>

<div class="tabs">
    <button class="active" onclick="filter('all', this)">الكل</button>
    <button onclick="filter('islam', this)">🌙 إسلامي</button>
    <button onclick="filter('yemen', this)">🇾🇪 اليمن</button>
    <button onclick="filter('sport', this)">⚽ رياضة</button>
    <button onclick="filter('doc', this)">🐾 وثائقي</button>
    <button onclick="filter('movie', this)">🎬 أفلام</button>
    <button onclick="filter('fight', this)">🥊 مصارعة</button>
</div>

<div class="grid" id="main-grid">
    <div class="card" data-cat="islam" onclick="play('https://win.holol.com/live/quran/playlist.m3u8')"><i>🌙</i><span>القرآن الكريم (مكة)</span></div>
    <div class="card" data-cat="islam" onclick="play('https://win.holol.com/live/sunnah/playlist.m3u8')"><i>🕋</i><span>السنة النبوية (المدينة)</span></div>
    <div class="card" data-cat="yemen" onclick="play('https://yemenshabab.com/live/index.m3u8')"><i>🇾🇪</i><span>يمن شباب</span></div>
    <div class="card" data-cat="yemen" onclick="play('https://almahriah.net/live/master.m3u8')"><i>🇾🇪</i><span>المهرية</span></div>
    <div class="card" data-cat="yemen" onclick="play('https://almasirah.net.ye/live/index.m3u8')"><i>🇾🇪</i><span>المسيرة</span></div>
    
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('vid', { fluid: true });
    function play(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 60, behavior: 'smooth' });
    }
    function filter(cat, btn) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    function search() {
        let val = document.getElementById('search-input').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            let name = c.innerText.toLowerCase();
            c.style.display = name.includes(val) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
