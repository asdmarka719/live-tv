<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية رفيق TV | 970+ CH & VIP 💎</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --main: #00f2fe; --bg: #050811; --card: #131927; --vip: #ff0055; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        header { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--main); font-weight: bold; position: sticky; top: 0; z-index: 2000; }
        .player-wrap { position: sticky; top: 55px; z-index: 1000; background: #000; border-bottom: 1px solid var(--main); }
        video { width: 100%; max-height: 240px; }
        .search-area { padding: 12px; background: #0a111f; }
        #search { width: 90%; padding: 12px; border-radius: 25px; border: 1px solid var(--main); background: #1e293b; color: white; text-align: center; margin: 0 5%; }
        .tabs { display: flex; overflow-x: auto; gap: 8px; padding: 15px; background: var(--bg); scrollbar-width: none; }
        .tabs button { background: var(--card); color: white; border: 1px solid #333; padding: 10px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tabs button.active { background: var(--main); color: #000; font-weight: bold; }
        .tabs button.vip-tab { border-color: var(--vip); color: var(--vip); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #222; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--main); transform: translateY(-3px); }
        .card i { font-size: 26px; display: block; margin-bottom: 8px; }
        .card span { font-size: 11px; font-weight: bold; display: block; height: 30px; overflow: hidden; }
        .badge { position: absolute; top: 5px; right: 5px; background: var(--vip); color: white; font-size: 8px; padding: 2px 6px; border-radius: 5px; font-weight: bold; }
        #loader { text-align: center; padding: 30px; color: var(--main); }
    </style>
</head>
<body>

<header>🚀 RAFIQ TV - البث الإمبراطوري 🚀</header>

<div class="player-wrap">
    <video id="player" playsinline controls></video>
</div>

<div class="search-area">
    <input type="text" id="search" placeholder="🔍 ابحث عن (beIN, MBC, شاهد، اليمن...)" onkeyup="search()">
</div>

<div class="tabs">
    <button class="active" onclick="filter('all', this)">الكل ✨</button>
    <button class="vip-tab" onclick="filter('vip', this)">SHAHID & Netflix 🍿</button>
    <button onclick="filter('sport', this)">الرياضة ⚽</button>
    <button onclick="filter('yemen', this)">اليمن 🇾🇪</button>
    <button onclick="filter('nile', this)">نايل سات 🛰️</button>
</div>

<div id="loader">جاري جلب القنوات الموثوقة...</div>
<div class="grid" id="main-grid"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const player = new Plyr(video);
    const hls = new Hls();
    const grid = document.getElementById('main-grid');
    const loader = document.getElementById('loader');

    // رابط المصدر الموحد العالمي لضمان التحديث التلقائي
    const m3uUrl = 'https://raw.githubusercontent.com/mohamed-attya/IPTV-Free-Arabic/master/Arabic.m3u';

    async function init() {
        try {
            const resp = await fetch(m3uUrl);
            const data = await resp.text();
            const channels = parse(data);
            render(channels);
            loader.style.display = 'none';
        } catch (e) {
            loader.innerText = '⚠️ السيرفر يحتاج تحديث، جاري استخدام الاحتياطي';
        }
    }

    function parse(data) {
        const lines = data.split('\n');
        let list = [];
        let name = '';
        lines.forEach(line => {
            if (line.startsWith('#EXTINF:')) {
                name = line.split(',')[1] || 'قناة';
            } else if (line.startsWith('http')) {
                const url = line.trim();
                let low = name.toLowerCase();
                let cat = 'nile';
                if (low.includes('shahid') || low.includes('netflix') || low.includes('vip') || low.includes('drama')) cat = 'vip';
                else if (low.includes('bein') || low.includes('sport') || low.includes('ssc')) cat = 'sport';
                else if (low.includes('yemen') || low.includes('shabab')) cat = 'yemen';
                list.push({ name, url, cat });
            }
        });
        return list;
    }

    function render(list) {
        grid.innerHTML = list.map(ch => `
            <div class="card" data-cat="${ch.cat}" onclick="play('${ch.url}')">
                ${ch.cat === 'vip' ? '<div class="badge">VIP</div>' : ''}
                <i>${getIcon(ch.cat)}</i>
                <span>${ch.name}</span>
            </div>
        `).join('');
    }

    function getIcon(cat) {
        if(cat === 'vip') return '🍿';
        if(cat === 'sport') return '⚽';
        if(cat === 'yemen') return '🇾🇪';
        return '🛰️';
    }

    function play(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
        window.scrollTo({ top: 55, behavior: 'smooth' });
    }

    function filter(cat, btn) {
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function search() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none';
        });
    }

    init();
</script>
</body>
</html>
