<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFIQ PREMIUM TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/fantasy/index.css" rel="stylesheet">
    <style>
        :root { --main-color: #ff0055; --bg-dark: #080a12; --card-bg: #151a2d; }
        body { margin: 0; background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* الهيدر */
        header { background: linear-gradient(45deg, #121625, var(--main-color)); padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }

        /* منطقة المشغل الثابتة */
        .player-box { position: sticky; top: 0; z-index: 999; background: #000; padding: 10px; border-bottom: 3px solid var(--main-color); }
        .video-js { width: 100% !important; height: 210px !important; border-radius: 12px; overflow: hidden; }

        /* التصنيفات */
        .tabs { display: flex; overflow-x: auto; padding: 15px; gap: 10px; scrollbar-width: none; }
        .tabs button { background: var(--card-bg); color: white; border: 1px solid #2d3550; padding: 10px 20px; border-radius: 25px; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .tabs button.active { background: var(--main-color); border-color: var(--main-color); box-shadow: 0 0 15px var(--main-color); }

        /* شبكة القنوات */
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
        .channel-card { background: var(--card-bg); border-radius: 15px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid #1e2540; transition: 0.3s; position: relative; }
        .channel-card:hover { transform: scale(1.05); border-color: var(--main-color); }
        .channel-card .icon { font-size: 24px; margin-bottom: 8px; display: block; }
        .channel-card span { font-size: 11px; font-weight: bold; line-height: 1.2; display: block; height: 26px; overflow: hidden; }
        .live-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 5px #00ff00; animation: blink 1s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @media (min-width: 768px) { .video-js { height: 450px !important; } }
    </style>
</head>
<body>

<header><h1>RAFIQ PREMIUM TV 💎</h1></header>

<div class="player-box">
    <video id="main-player" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="tabs">
    <button class="active" onclick="filterCat('all')">الكل ✨</button>
    <button onclick="filterCat('sport')">رياضة beIN ⚽</button>
    <button onclick="filterCat('yemen')">اليمن السعيد 🇾🇪</button>
    <button onclick="filterCat('news')">أخبار العالم 🌍</button>
    <button onclick="filterCat('kids')">أطفال 🦄</button>
</div>

<div class="channels-grid" id="main-grid">
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('main-player', { fluid: true, playbackRates: [0.5, 1, 1.5, 2] });
    function playChan(url) {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function filterCat(cat) {
        document.querySelectorAll('.channel-card').forEach(card => {
            card.style.display = (cat === 'all' || card.dataset.category === cat) ? 'block' : 'none';
        });
        document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>
</body>
</html>
